name: Repository Quality Check

on:
    push:
        branches: [main, rebuild/clean-v2]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    quality-check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Run database-free quality checks
              run: npm run quality
